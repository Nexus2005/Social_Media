<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <style>
    .title { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .label { fill: #94a3b8; font-size: 11px; }
    .grid { stroke: #334155; stroke-dasharray: 2 2; stroke-width: 0.5; }
    .axis { stroke: #475569; stroke-width: 1; }
    .bar { fill: url(#barGrad); rx: 3; }
    .bar-hover:hover { fill: #60a5fa; }
    .legend-text { fill: #cbd5e1; font-size: 11px; }
  </style>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="barGradSecondary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <text x="20" y="30" class="title">Pipeline Failure Modes Frequency</text>
  <line x1="120" y1="60" x2="120" y2="340" class="grid" />
  <text x="120" y="356" class="label" text-anchor="middle">0</text>
  <line x1="208" y1="60" x2="208" y2="340" class="grid" />
  <text x="208" y="356" class="label" text-anchor="middle">1</text>
  <line x1="296" y1="60" x2="296" y2="340" class="grid" />
  <text x="296" y="356" class="label" text-anchor="middle">2</text>
  <line x1="384" y1="60" x2="384" y2="340" class="grid" />
  <text x="384" y="356" class="label" text-anchor="middle">3</text>
  <line x1="472" y1="60" x2="472" y2="340" class="grid" />
  <text x="472" y="356" class="label" text-anchor="middle">4</text>
  <line x1="560" y1="60" x2="560" y2="340" class="grid" />
  <text x="560" y="356" class="label" text-anchor="middle">5</text>
  <text x="110" y="81.5" class="label" text-anchor="end">BLUR</text>
  <rect x="120" y="68.5" width="176" height="18" fill="#ef4444" rx="2" />
  <text x="302" y="81.5" class="label" style="fill: #e2e8f0;">2</text>
  <text x="110" y="116.5" class="label" text-anchor="end">MOTION BLUR</text>
  <rect x="120" y="103.5" width="2" height="18" fill="#ef4444" rx="2" />
  <text x="126" y="116.5" class="label" style="fill: #e2e8f0;">0</text>
  <text x="110" y="151.5" class="label" text-anchor="end">OCCLUSION</text>
  <rect x="120" y="138.5" width="88" height="18" fill="#ef4444" rx="2" />
  <text x="214" y="151.5" class="label" style="fill: #e2e8f0;">1</text>
  <text x="110" y="186.5" class="label" text-anchor="end">SMALL OBJECTS</text>
  <rect x="120" y="173.5" width="2" height="18" fill="#ef4444" rx="2" />
  <text x="126" y="186.5" class="label" style="fill: #e2e8f0;">0</text>
  <text x="110" y="221.5" class="label" text-anchor="end">WRONG RETRIEVAL</text>
  <rect x="120" y="208.5" width="2" height="18" fill="#ef4444" rx="2" />
  <text x="126" y="221.5" class="label" style="fill: #e2e8f0;">0</text>
  <text x="110" y="256.5" class="label" text-anchor="end">MULTIPLE IDENTICAL PRODUCTS</text>
  <rect x="120" y="243.5" width="2" height="18" fill="#ef4444" rx="2" />
  <text x="126" y="256.5" class="label" style="fill: #e2e8f0;">0</text>
  <text x="110" y="291.5" class="label" text-anchor="end">MISSING OCR</text>
  <rect x="120" y="278.5" width="264" height="18" fill="#ef4444" rx="2" />
  <text x="390" y="291.5" class="label" style="fill: #e2e8f0;">3</text>
  <text x="110" y="326.5" class="label" text-anchor="end">API FAILURES</text>
  <rect x="120" y="313.5" width="2" height="18" fill="#ef4444" rx="2" />
  <text x="126" y="326.5" class="label" style="fill: #e2e8f0;">0</text>
</svg>