<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <style>
    .title { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .label { fill: #94a3b8; font-size: 11px; }
    .grid { stroke: #334155; stroke-dasharray: 2 2; stroke-width: 0.5; }
    .axis { stroke: #475569; stroke-width: 1; }
    .legend-text { fill: #cbd5e1; font-size: 11px; }
  </style>
  <text x="20" y="30" class="title">Cartly Performance &amp; Accuracy Evolution Trends</text>
  
  <!-- Plot box -->
  <line x1="60" y1="60" x2="60" y2="340" class="axis" />
  <line x1="60" y1="340" x2="540" y2="340" class="axis" />
  <line x1="540" y1="60" x2="540" y2="340" class="axis" />
  <line x1="60" y1="340" x2="540" y2="340" class="grid" />
  <text x="50" y="344" class="label" text-anchor="end">0s</text>
  <text x="550" y="344" class="label" text-anchor="start">0%</text>
  <line x1="60" y1="284" x2="540" y2="284" class="grid" />
  <text x="50" y="288" class="label" text-anchor="end">300s</text>
  <text x="550" y="288" class="label" text-anchor="start">20%</text>
  <line x1="60" y1="228" x2="540" y2="228" class="grid" />
  <text x="50" y="232" class="label" text-anchor="end">600s</text>
  <text x="550" y="232" class="label" text-anchor="start">40%</text>
  <line x1="60" y1="172" x2="540" y2="172" class="grid" />
  <text x="50" y="176" class="label" text-anchor="end">900s</text>
  <text x="550" y="176" class="label" text-anchor="start">60%</text>
  <line x1="60" y1="116" x2="540" y2="116" class="grid" />
  <text x="50" y="120" class="label" text-anchor="end">1200s</text>
  <text x="550" y="120" class="label" text-anchor="start">80%</text>
  <line x1="60" y1="60" x2="540" y2="60" class="grid" />
  <text x="50" y="64" class="label" text-anchor="end">1500s</text>
  <text x="550" y="64" class="label" text-anchor="start">100%</text>
  <text x="120" y="360" class="label" text-anchor="middle">v0.1</text>
  <text x="240" y="360" class="label" text-anchor="middle">v0.2</text>
  <text x="360" y="360" class="label" text-anchor="middle">v0.3</text>
  <text x="480" y="360" class="label" text-anchor="middle">v1.0 (Current)</text>\n  <path d="${latPath}" fill="none" stroke="#ef4444" stroke-width="3" />\n  <circle cx="${px}" cy="${py}" r="5" fill="#ef4444" />\n  <text x="${px}" y="${py - 10}" class="label" text-anchor="middle" style="fill: #fca5a5; font-weight: bold;">${latencies[i].toFixed(1)}s</text>\n  <circle cx="${px}" cy="${py}" r="5" fill="#ef4444" />\n  <text x="${px}" y="${py - 10}" class="label" text-anchor="middle" style="fill: #fca5a5; font-weight: bold;">${latencies[i].toFixed(1)}s</text>\n  <circle cx="${px}" cy="${py}" r="5" fill="#ef4444" />\n  <text x="${px}" y="${py - 10}" class="label" text-anchor="middle" style="fill: #fca5a5; font-weight: bold;">${latencies[i].toFixed(1)}s</text>\n  <circle cx="${px}" cy="${py}" r="5" fill="#ef4444" />\n  <text x="${px}" y="${py - 10}" class="label" text-anchor="middle" style="fill: #fca5a5; font-weight: bold;">${latencies[i].toFixed(1)}s</text>\n  <path d="${accPath}" fill="none" stroke="#10b981" stroke-width="3" />\n  <circle cx="${px}" cy="${py}" r="5" fill="#10b981" />\n  <text x="${px}" y="${py + 15}" class="label" text-anchor="middle" style="fill: #6ee7b7; font-weight: bold;">${(mAP[i] * 100).toFixed(0)}%</text>\n  <circle cx="${px}" cy="${py}" r="5" fill="#10b981" />\n  <text x="${px}" y="${py + 15}" class="label" text-anchor="middle" style="fill: #6ee7b7; font-weight: bold;">${(mAP[i] * 100).toFixed(0)}%</text>\n  <circle cx="${px}" cy="${py}" r="5" fill="#10b981" />\n  <text x="${px}" y="${py + 15}" class="label" text-anchor="middle" style="fill: #6ee7b7; font-weight: bold;">${(mAP[i] * 100).toFixed(0)}%</text>\n  <circle cx="${px}" cy="${py}" r="5" fill="#10b981" />\n  <text x="${px}" y="${py + 15}" class="label" text-anchor="middle" style="fill: #6ee7b7; font-weight: bold;">${(mAP[i] * 100).toFixed(0)}%</text>\n  <!-- Legend -->\n  <rect x="200" y="375" width="12" height="12" fill="#ef4444" rx="2" />\n  <text x="218" y="385" class="legend-text">Pipeline Latency (s)</text>\n  <rect x="350" y="375" width="12" height="12" fill="#10b981" rx="2" />\n  <text x="368" y="385" class="legend-text">Retrieval mAP</text>\n</svg>